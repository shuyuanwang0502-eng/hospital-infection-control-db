# docker compose up
# starts postgres 16, creates the schema, loads the data and runs tests + queries
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital_infection
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  setup:
    image: postgres:16
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hospital_infection
    volumes: [".:/project:ro"]
    working_dir: /project
    entrypoint: ["bash", "scripts/run_all.sh"]
